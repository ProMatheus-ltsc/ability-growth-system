name = "ability-growth-sync"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# D1 数据库绑定
# database_id 不写在文件里，通过环境变量 {D1_DATABASE_ID} 注入（wrangler 支持 {} 插值语法）：
#   - 本地部署：在 worker/.dev.vars 中写 D1_DATABASE_ID=<你的id>（该文件已 gitignore，不会提交）
#   - CI/云端：在 CI secrets 或 shell 环境变量中设置 D1_DATABASE_ID
[[d1_databases]]
binding = "DB"
database_name = "ability_growth"
database_id = "88b2a816-77bc-4f51-b2c7-d54c7a27e273"

# 可选鉴权 Token：请勿写在 [vars] 里！
# 用 `npx wrangler secret put SYNC_AUTH_TOKEN` 设置（运行时通过 env.SYNC_AUTH_TOKEN 读取，不进代码库）。
# 前端「云端同步」页的 authToken 必须与此一致。
