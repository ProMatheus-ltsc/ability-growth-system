name = "ability-growth-sync"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# D1 数据库绑定（部署唯一需要配置的地方）
# 在 Cloudflare Dashboard → Workers & Pages → D1 数据库 页面查看你的 database_name 与 database_id，
# 把下面的值替换成你自己的即可，无需任何环境变量：
[[d1_databases]]
binding = "DB"
database_name = "ability_growth"
database_id = "88b2a816-77bc-4f51-b2c7-d54c7a27e273"

# 可选鉴权 Token：请勿写在 [vars] 里！
# 用 `npx wrangler secret put SYNC_AUTH_TOKEN` 设置（运行时通过 env.SYNC_AUTH_TOKEN 读取，不进代码库）。
# 前端「云端同步」页的 authToken 必须与此一致（留空则不启用鉴权）。
