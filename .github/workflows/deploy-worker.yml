name: Deploy D1 Sync Worker

# 自动部署 worker/ 下的 Cloudflare D1 同步 Worker：
#   push 到 main 且 worker/ 有变更时，自动建表(幂等) + wrangler deploy。
# 也可以在 Actions 页面手动触发（workflow_dispatch）。
#
# 前置条件（GitHub 仓库 Settings → Secrets and variables → Actions 配置 2 个 Secrets）：
#   CLOUDFLARE_API_TOKEN  权限需包含：Account - Workers Scripts: Edit / D1: Edit / Workers Routes: Edit
#   CLOUDFLARE_ACCOUNT_ID 你的 Cloudflare 账号 ID（Dashboard 首页右侧可查）
# 同时确保 worker/wrangler.toml 的 database_id 已替换为你的真实 D1 database_id（占位符会导致部署失败）。

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 幂等建表（worker/schema.sql 全为 CREATE TABLE IF NOT EXISTS，可重复执行）
      - name: Apply D1 schema
        run: npm run db:init
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 播种外部导入的练习数据（粉笔 → 训练/缺口/能力快照）。
      # 走 CI 是因为本机对 *.workers.dev 有 DNS 污染，直连不到 Worker；
      # GitHub runner 能正常访问 Cloudflare API。
      # seed-fenbi.sql 用 LWW upsert（updated_at 较旧的不会覆盖较新的），可重复执行。
      - name: Seed fenbi practice data
        if: hashFiles('worker/seed-fenbi.sql') != ''
        run: npx wrangler d1 execute ability_growth --remote --file=./seed-fenbi.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify seed
        if: hashFiles('worker/seed-fenbi.sql') != ''
        run: >-
          npx wrangler d1 execute ability_growth --remote --command
          "SELECT 'trainings' AS tbl, COUNT(*) AS n FROM trainings
          UNION ALL SELECT 'gaps', COUNT(*) FROM gaps
          UNION ALL SELECT 'abilities', COUNT(*) FROM abilities
          UNION ALL SELECT 'reviews', COUNT(*) FROM reviews
          UNION ALL SELECT 'tasks', COUNT(*) FROM tasks" | tee seed-verify.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 把校验结果提交回仓库：api.github.com 在部分网络环境不可达，
      # 但 git over https 可用，用 git 取回报告是唯一稳定的验证通道。
      # 报告写在 reports/ 下（不在 worker/ 内），避免再次触发本 workflow。
      - name: Commit verification report
        if: hashFiles('worker/seed-fenbi.sql') != ''
        run: |
          mkdir -p ../reports
          {
            echo "## 粉笔练习数据播种校验"
            echo
            echo
            echo '```'
            cat seed-verify.txt
            echo '```'
          } > ../reports/seed-verify.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ../reports/seed-verify.md
          if git diff --staged --quiet; then
            echo "报告无变化，跳过提交"
          else
            git commit -m "chore(worker): 粉笔练习数据播种校验报告"
            git push
          fi
